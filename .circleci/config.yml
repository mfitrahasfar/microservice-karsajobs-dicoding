version: 2.1

jobs:
  lint-dockerfile:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install hadolint (no sudo, add to PATH)
          command: |
            set -euo pipefail
            mkdir -p "$HOME/bin"
            curl -fsSL --retry 5 -o "$HOME/bin/hadolint" \
              https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
            chmod +x "$HOME/bin/hadolint"
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            hadolint --version
      - run:
          name: Lint Dockerfile
          command: hadolint Dockerfile

  test-app:
    docker:
      - image: cimg/go:1.21
    steps:
      - checkout
      - run:
          name: Download Go modules
          command: go mod download
      - run:
          name: Run unit tests (short)
          command: go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:            # gunakan Docker daemon default CircleCI
          docker_layer_caching: false
      - run:
          name: Login GHCR
          command: echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run:
          name: Build image (tag commit & latest)
          command: |
            set -euo pipefail
            GHCR_USER_LC=$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')   # paksa lowercase
            IMAGE_NAME="ghcr.io/${GHCR_USER_LC}/karsajobs"
            SHORT_SHA=$(echo "$CIRCLE_SHA1" | cut -c1-7)

            echo "Building ${IMAGE_NAME}:${SHORT_SHA} and :latest"
            docker build -t "${IMAGE_NAME}:${SHORT_SHA}" -t "${IMAGE_NAME}:latest" -f Dockerfile .
      - run:
          name: Push image
          command: |
            set -euo pipefail
            GHCR_USER_LC=$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/${GHCR_USER_LC}/karsajobs"
            SHORT_SHA=$(echo "$CIRCLE_SHA1" | cut -c1-7)

            docker push "${IMAGE_NAME}:${SHORT_SHA}"
            docker push "${IMAGE_NAME}:latest"

workflows:
  karsajobs_pipeline:
    jobs:
      - lint-dockerfile:
          filters:
            branches:
              only: karsajobs
      - test-app:
          requires: [lint-dockerfile]
          filters:
            branches:
              only: karsajobs
      - build-app-karsajobs:
          requires: [test-app]
          filters:
            branches:
              only: karsajobs